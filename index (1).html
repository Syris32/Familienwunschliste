.b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.b h3{margin:0;font-size:.98rem}.n{font-size:.88rem;color:var(--mu);background:var(--bg);padding:8px;border-radius:8px}
.by{color:var(--ok);font-weight:600;font-size:.9rem}.sp{flex:1}

const $=s=>document.querySelector(s),nm=$('#nm'),st=$('#st');
let claims={},busy=false;
try{nm.value=localStorage.getItem('wl_name')||''}catch(e){}
const key=n=>n.trim().toLowerCase().replace(/\s+/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='Nils';
const kidKey=(k,w)=>k?k+'|'+(w==='sax'?'sax':W.find(x=>x.id===w).who.toLowerCase()):'';
function render(){
 const k=key(nm.value);
 let h='<div class="tabs">';
 for(const who of ['Nils','Leonard']){
  const free=W.filter(x=>x.who===who&&x.id!=='sax'&&!Object.values(claims).some(c=>c.wish===x.id)).length;
  h+=`<button class="tab${tab===who?' on':''}" data-t="${who}">${who} <small>(${free} frei)</small></button>`;
 }
 h+='</div>';
 const who=tab,mineKid=k?Object.values(claims).find(c=>c.key===k+'|'+who.toLowerCase()):null;
 h+=`<h2>Wünsche von ${who}</h2>`+(mineKid?`<p class="hint">Du hast für ${who} schon einen Wunsch gewählt. Für das andere Kind kannst du einen weiteren aussuchen.</p>`:'')+'<div class="g">';
 for(const w of W.filter(x=>x.who===who)){
  const isS=w.id==='sax',list=Object.values(claims).filter(c=>c.wish===w.id),c=list[0],kk=kidKey(k,w.id);
  const taken=!isS&&c;
  h+=`<div class="c${taken?' t':''}"><img src="${w.img}" alt=""><div class="b"><h3>${esc(w.title)}</h3>${w.note?`<div class="n">${esc(w.note)}</div>`:''}<div class="sp"></div>`;
  if(isS&&list.length)h+=`<div class="by">Unterstützt von: ${list.map(x=>esc(x.name)).join(', ')}</div>`;
  if(taken)h+=`<div class="by">✓ Reserviert von ${esc(c.name)}</div>`+(c.key===kk&&k?`<button class="s" data-r="${w.id}">Wieder freigeben</button>`:'');
  else if(isS&&list.some(x=>x.key===kk&&k))h+=`<button class="s" data-r="${w.id}">Beitrag zurücknehmen</button>`;
  else h+=`<button data-w="${w.id}" ${col?'':'disabled'}>${isS?'Ich unterstütze mit Geld':'Diesen Wunsch erfüllen'}</button>`;
  h+='</div></div>';
 }
 $('#app').innerHTML=h+'</div>';
}
const API='https://script.google.com/macros/s/AKfycbzQ4xL0wyOno4Qj3nJldo6486cfGTErs68P6Oif1BSe2bZ6KIy2GRi19gudTU4oimou/exec';
let col=false;
async function call(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(b)});return r.json()}
function apply(d){claims={};(d.claims||[]).forEach((c,i)=>claims[i]=c);render()}
async function load(){try{apply(await (await fetch(API)).json());st.textContent=''}catch(e){st.textContent='Verbindung gerade nicht möglich …'}}
async function claim(id){
 const name=nm.value.trim(),k=kidKey(key(name),id);
 if(!key(name)){alert('Bitte zuerst deinen Namen eingeben.');nm.focus();return}
 if(Object.values(claims).some(c=>c.key===k)){alert('Du hast für dieses Kind schon einen Wunsch gewählt (das Saxophon zählt nicht mit). Gib ihn zuerst wieder frei, wenn du wechseln möchtest.');return}
 if(busy)return;busy=true;
 try{
  const d=await call({action:'claim',wish:id,name,key:k});apply(d);
  if(d.error==='taken')alert('Leider war jemand schneller – dieser Wunsch ist schon vergeben.');
  else if(d.error==='already')alert('Du hast schon einen Wunsch gewählt. Gib ihn zuerst wieder frei, wenn du wechseln möchtest.');
  else if(d.error)alert('Das hat nicht geklappt. Bitte erneut versuchen.');
  else{try{localStorage.setItem('wl_name',name)}catch(e){}}
 }catch(e){alert('Das hat nicht geklappt. Bitte erneut versuchen.')}finally{busy=false}
}
async function release(id){
 const k=kidKey(key(nm.value),id);if(!key(nm.value)||busy)return;busy=true;
 try{apply(await call({action:'release',wish:id,key:k}))}catch(e){alert('Freigeben hat nicht geklappt.')}finally{busy=false}
}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.dataset.t?(tab=b.dataset.t,render()):b.dataset.w?claim(b.dataset.w):b.dataset.r&&release(b.dataset.r)});
nm.addEventListener('input',render);
render();
if(API.includes('HIER_DEINE')){st.textContent='Noch nicht eingerichtet: Google-Skript-URL fehlt (nur Ansicht).'}
else{col=true;load().then(render);setInterval(load,10000)}
</script></body></html>
